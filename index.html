<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Chat UI</title>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="w-full max-w-md bg-white rounded-xl shadow flex flex-col">

    <!-- Header -->
    <div class="p-4 border-b flex items-center gap-3">
      <div class="w-10 h-10 bg-indigo-500 rounded-full"></div>
      <div>
        <p class="font-semibold">Alex</p>
        <p class="text-xs text-green-500">Online</p>
      </div>
    </div>

    <!-- Messages -->
    <div class="flex-1 p-4 space-y-3 overflow-y-auto">
      <!-- Incoming -->
      <div class="flex">
        <div class="bg-gray-200 p-3 rounded-lg max-w-xs">
          Hey! How’s it going?
        </div>
      </div>

      <!-- Outgoing -->
      <div class="flex justify-end">
        <div class="bg-indigo-600 text-white p-3 rounded-lg max-w-xs">
          Good! Working on the project 😄
        </div>
      </div>

      <div class="flex">
        <div class="bg-gray-200 p-3 rounded-lg max-w-xs">
          Nice! Let me know if you need help.
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="p-4 border-t flex gap-2">
      <input
        type="text"
        placeholder="Type a message..."
        class="flex-1 border rounded-lg px-3 py-2 focus:outline-none focus:ring focus:ring-indigo-300"
      />
      <button class="bg-indigo-600 text-white px-4 rounded-lg">
        Send
      </button>
    </div>

  </div>

</body>
</html>
